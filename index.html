
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#170D29">
  <title>BUGTAW - Your Voice, Your World</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #170D29;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 28px 20px;
    }

    .logo {
      text-align: center;
      padding-top: 65px;
    }

    .logo h1 {
      font-size: 48px;
      color: #C69AFF;
      letter-spacing: 5px;
      margin-bottom: 5px;
    }

    .logo p {
      color: #BCA5D6;
      letter-spacing: 3px;
      font-size: 11px;
    }

    .panel {
      background: #281A3D;
      border-radius: 20px;
      padding: 25px;
      margin-top: 55px;
    }

    h2 { font-size: 24px; }

    .description {
      color: #C3B4D4;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      margin-top: 15px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .google {
      background: white;
      color: #241735;
    }

    .email {
      background: #8654C9;
      color: white;
    }

    .footer {
      text-align: center;
      color: #9F8BAC;
      font-size: 12px;
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="logo">
      <h1>BUGTAW</h1>
      <p>YOUR VOICE. YOUR WORLD.</p>
    </header>

    <section class="panel">
      <h2>Welcome to BUGTAW</h2>

      <p class="description">
        Connect, communicate and discover
        new communities.
      </p>

      <button class="google"
        onclick="alert('Google login coming soon!')">
        Continue with Google
      </button>

      <button class="email"
        onclick="alert('Email login coming soon!')">
        Continue with Email
      </button>

      <p class="footer">
        Your community. Your voice.
      </p>
    </section>
  </main>
</body>
</html>
